services:
  - type: web
    name: gateway-ai-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node web/server.js
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: GEMINI_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
